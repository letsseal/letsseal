# Let's Seal cuts one release per `v*` tag: the sealed source archive plus the
# native sealbot binaries, published together as a single GitHub Release.
#
# The source half is supply-chain proof generated by CI. We build a reproducible
# archive and prove it with our own GitHub Action (the `sealbot` in
# ci/github-action): a cosign-compatible signature plus a SLSA provenance
# attestation, anchored to Bitcoin and the public transparency log. Anyone can
# verify the source with stock cosign, with no Let's Seal software involved.
#
# The binary half cross-compiles the Rust CLI for macOS (arm64, x64), Linux
# (x64 musl) and Windows (x64). The crate is pure Rust (rustls, no OpenSSL), so
# every target builds cleanly.
#
# Both halves feed one `release` job, so exactly one workflow ever creates the
# Release for a tag. Everything runs on the built-in GITHUB_TOKEN.
#
# One-time setup: add repo secret `LETSSEAL_API_KEY` = an sk_live_ key whose org
# (letsseal) has a code-signing cert. Without it, the seal job falls back to
# keyless `anchor` (a Bitcoin timestamp of the source) so releases stay proven.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  LETSSEAL_APP: https://app.letsseal.org

jobs:
  seal:
    name: seal source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the tag object + full tree for `git archive`

      - name: Build reproducible source tarball
        id: build
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          VER="${REF#v}"
          mkdir -p dist
          # Deterministic archive: fixed prefix, gzip -n (no name/mtime in header).
          git archive --format=tar --prefix="letsseal-${VER}/" "${REF}" | gzip -n -9 > "dist/letsseal-${VER}.tar.gz"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Built dist/letsseal-${VER}.tar.gz"

      # Pick the strongest proof the available credentials allow: full sign+SLSA
      # when a code-signing key is configured, else a keyless Bitcoin timestamp.
      - name: Select proof mode
        id: mode
        env:
          KEY: ${{ secrets.LETSSEAL_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "mode=sign" >> "$GITHUB_OUTPUT"; else echo "mode=anchor" >> "$GITHUB_OUTPUT"; fi

      - name: Prove the source (${{ steps.mode.outputs.mode }})
        id: prove
        uses: ./ci/github-action
        with:
          mode: ${{ steps.mode.outputs.mode }}
          files: dist/*.tar.gz
          app: ${{ env.LETSSEAL_APP }}
          token: ${{ secrets.LETSSEAL_API_KEY }}

      - name: Stage the proof bundle alongside the tarball
        run: |
          set -euo pipefail
          [ -f sealbot-manifest.json ] && cp sealbot-manifest.json dist/ || true
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: sealed-source
          path: dist/**

  binaries:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: aarch64-apple-darwin,      name: sealbot-macos-arm64 }
          - { os: macos-latest,   target: x86_64-apple-darwin,       name: sealbot-macos-x64 }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl, name: sealbot-linux-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    name: sealbot-windows-x64.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: endsWith(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        working-directory: cli-rs
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        working-directory: cli-rs
        run: |
          bin="target/${{ matrix.target }}/release/sealbot"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" "../${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    name: publish release
    needs: [seal, binaries]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the Release + upload assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One checksum file covering every published asset, source and binaries.
      - name: Checksum every asset
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Let's Seal ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
