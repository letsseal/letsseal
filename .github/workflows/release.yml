# Let's Seal seals its own releases — supply-chain proof, generated by CI.
#
# On every `v*` tag we build the reproducible source archive and prove it with our
# own GitHub Action (the `sealbot` in ci/github-action): a cosign-compatible
# signature + a SLSA provenance attestation, anchored to Bitcoin and the public
# transparency log. The sealed assets are attached to the GitHub Release, so anyone
# can verify the source with stock cosign — no Let's Seal software required.
#
# One-time setup: add repo secret `LETSSEAL_API_KEY` = an sk_live_ key whose org
# (letsseal) has a code-signing cert. Without it, the job falls back to keyless
# `anchor` (a Bitcoin timestamp of the source) so releases are still proven.
name: Release (seal source)

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write   # create the Release + upload assets

env:
  LETSSEAL_APP: https://app.letsseal.org

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the tag object + full tree for `git archive`

      - name: Build reproducible source tarball
        id: build
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          VER="${REF#v}"
          mkdir -p dist
          # Deterministic archive: fixed prefix, gzip -n (no name/mtime in header).
          git archive --format=tar --prefix="letsseal-${VER}/" "${REF}" | gzip -n -9 > "dist/letsseal-${VER}.tar.gz"
          ( cd dist && sha256sum ./*.tar.gz > SHA256SUMS )
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Built dist/letsseal-${VER}.tar.gz"; cat dist/SHA256SUMS

      # Pick the strongest proof the available credentials allow: full sign+SLSA
      # when a code-signing key is configured, else a keyless Bitcoin timestamp.
      - name: Select proof mode
        id: mode
        env:
          KEY: ${{ secrets.LETSSEAL_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "mode=sign" >> "$GITHUB_OUTPUT"; else echo "mode=anchor" >> "$GITHUB_OUTPUT"; fi

      - name: Prove the source (${{ steps.mode.outputs.mode }})
        id: prove
        uses: ./ci/github-action
        with:
          mode: ${{ steps.mode.outputs.mode }}
          files: dist/*.tar.gz
          app: ${{ env.LETSSEAL_APP }}
          token: ${{ secrets.LETSSEAL_API_KEY }}

      - name: Refresh checksums (include the cosign/attestation bundles)
        run: ( cd dist && sha256sum ./* > SHA256SUMS && cat SHA256SUMS )

      - name: Upload proof bundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: letsseal-${{ steps.build.outputs.version }}-sealed
          path: |
            dist/**
            sealbot-manifest.json

      - name: Create GitHub Release with sealed assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Let's Seal ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/**
            sealbot-manifest.json
