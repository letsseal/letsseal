# Fully-pinned dependency lock for the signing service (the key-holding process).
# CI and deploy.sh both install from THIS file, not requirements.txt, so the
# dependency tree under the CA and signing keys cannot drift on a restart.
#
# Regenerate whenever requirements.txt changes (CI fails if the two disagree,
# see check_requirements_sync.py):
#
#   cd signing-service
#   rm -rf .venv && python3 -m venv .venv
#   ./.venv/bin/pip install -q -r requirements.txt
#   ./.venv/bin/pip freeze | sort > requirements.lock   # then re-add this header
