# Example: prove every release artifact on tag. A cosign-compatible signature plus
# SLSA provenance, anchored to the public ledger, then attach the proofs to the
# GitHub Release. Drop this in .github/workflows/ in your repo.
#
# Setup: add repo secret LETSSEAL_API_KEY = an sk_live_ key whose org has a
# code-signing cert. (For a plain ledger timestamp with no key, use mode: anchor.)
name: Seal release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ... your build steps produce artifacts in dist/ ...

      - name: Sign + attest artifacts (digests only, files never leave the runner)
        id: seal
        uses: letsseal/letsseal/ci/github-action@main
        with:
          mode: sign
          files: |
            dist/**/*.tar.gz
            dist/**/*.whl
          app: https://app.letsseal.org
          token: ${{ secrets.LETSSEAL_API_KEY }}

      # Tlog-native bundles (.cosign.bundle + .att.bundle) sit next to each
      # artifact; ship them so downstream users verify with stock cosign against
      # our trusted root (curl <app>/trusted_root.json), no --insecure-ignore-tlog.
      - name: Attach artifacts + proofs to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/**
            ${{ steps.seal.outputs.manifest-path }}
