# Example: anchor every release artifact to Bitcoin on tag, and publish the proof
# manifest as a release asset. Drop this in .github/workflows/ in your repo.
name: Seal release
on:
  release:
    types: [published]

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ... your build steps produce artifacts in dist/ ...

      - name: Anchor artifacts (hashes only — files never leave the runner)
        id: seal
        uses: letsseal/letsseal/ci/github-action@main
        with:
          mode: anchor
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/*.whl
          app: https://app.letsseal.org
          token: ${{ secrets.LETSSEAL_API_KEY }}   # optional for anchor

      - name: Attach proof manifest to the release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.seal.outputs.manifest-path }}
