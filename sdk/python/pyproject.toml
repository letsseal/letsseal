[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "letsseal"
version = "0.1.0"
description = "Python client for the Let's Seal signing service: PAdES sealing, verification, and free Bitcoin anchoring. Zero-dependency."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Let's Seal" }]
keywords = ["letsseal", "pades", "pdf-signing", "opentimestamps", "bitcoin", "notary", "e-signature"]
dependencies = []

[project.urls]
Homepage = "https://letsseal.org"

[tool.setuptools.packages.find]
include = ["letsseal*"]
